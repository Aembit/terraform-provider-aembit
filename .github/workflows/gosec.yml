# Inspect code with Go Security Checker
name: Gosec Security Checker

# Enable check for pull requests and pushes on main and release branches
on:
  push:
    branches:
      - 'main'
      - 'release/*'
  pull_request:
    branches:
      - 'main'
      - 'release/*'
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SUBMODULE_CHECKOUT_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_CHECKOUT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            token: ${{ steps.generate-token.outputs.token }}
            submodules: recursive
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
            go-version-file: 'go.mod'
            cache: true
      - name: Go Mod Download
        run: go mod download
      - name: Install and Run Gosec Security Scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@17ad2dd7533fd4c773d916e2bc81446917d593b5
          $(go env GOPATH)/bin/gosec -exclude=G101,G117,G704 ./...

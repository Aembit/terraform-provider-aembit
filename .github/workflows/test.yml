# Terraform Provider testing workflow.
name: Tests
env:
  AEMBIT_STACK_DOMAIN: devbroadangle.aembit-eng.com
  AEMBIT_CLIENT_ID: aembit:devbroadangle:ad6127:identity:github_idtoken:8b4602f6-c65d-4785-8656-c1c2b390272d

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - 'README.md'
    branches:
      - 'main'
  push:
    branches:
      - 'main'
  # Include workflow_call to enable execution from aembit_smoke_test/regression.yml
  workflow_call:
    inputs:
      regression:
        required: false
        type: boolean
        default: false

# Ensure only one workflow run at a time across all branches/PRs
concurrency:
  group: tf-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUBMODULE_CHECKOUT_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_CHECKOUT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Aembit/terraform-provider-aembit
          token: ${{ steps.generate-token.outputs.token }}
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          TAR_OPTIONS: "--skip-old-files"
        with:
          go-version-file: 'go.mod'
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    name: Generate Docs
    runs-on: ubuntu-latest
    if: always() && !inputs.regression
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUBMODULE_CHECKOUT_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_CHECKOUT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Aembit/terraform-provider-aembit
          token: ${{ steps.generate-token.outputs.token }}
          submodules: recursive
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          TAR_OPTIONS: "--skip-old-files"
        with:
          go-version-file: 'go.mod'
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)


  # Generally test with the 3 most recent Terraform versions
  # Limit to only the latest for regression tests
  # References: https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/running-variations-of-jobs-in-a-workflow#excluding-matrix-configurations
  #             https://stackoverflow.com/a/65434401
  matrix_prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
    - id: set-matrix
      name: Set up Terraform version matrix
      env:
        REGRESSION: ${{ inputs.regression }}
      run: |
        echo "REGRESSION=$REGRESSION"
        if [[ $REGRESSION == 'true' ]]; then
          echo 'matrix=["latest"]' >> "$GITHUB_OUTPUT"
        else
          echo 'matrix=["latest", "1.14", "1.12"]' >> "$GITHUB_OUTPUT"
        fi

  # Run acceptance tests in a matrix with Terraform CLI versions
  test:
    name: Terraform Provider Acceptance Tests
    needs: [build,matrix_prep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # To get the GitHub Action ID JWT Token
    timeout-minutes: 15
    strategy:
      # TF Provider works with entities which have a single copy per tenant (ex: global policy compliance, sign-in policy)
      # It forces us to run the tests in sequence
      max-parallel: 1
      fail-fast: false
      matrix: 
        terraform: ${{ fromJson(needs.matrix_prep.outputs.matrix) }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUBMODULE_CHECKOUT_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_CHECKOUT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Aembit/terraform-provider-aembit
          token: ${{ steps.generate-token.outputs.token }}
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          TAR_OPTIONS: "--skip-old-files"
        with:
          go-version-file: 'go.mod'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - run: go mod download

      - name: Generate OIDC ID Token
        id: generate_oidc_token
        env:
          TFPROV_OIDC_TOKEN_SYMMETRIC_KEY: ${{ secrets.TFPROV_OIDC_TOKEN_SYMMETRIC_KEY }}
        run: |
          if [ -z "$TFPROV_OIDC_TOKEN_SYMMETRIC_KEY" ]; then
            echo "::warning::TFPROV_OIDC_TOKEN_SYMMETRIC_KEY is not set. Skipping OIDC token generation."
            exit 0
          fi

          TOKEN=$(python3 - << 'EOF'
          import hmac, hashlib, base64, json, time, os
          secret_b64 = os.environ['TFPROV_OIDC_TOKEN_SYMMETRIC_KEY']
          secret_bytes = base64.b64decode(secret_b64)
          if len(secret_bytes) < 64:
              secret_bytes = secret_bytes.ljust(64, b'\x00')
          header = base64.urlsafe_b64encode(json.dumps({'alg':'HS256','typ':'JWT'}).encode()).decode().rstrip('=')
          now = int(time.time())
          payload_data = {'iss':'aembit','sub':'terraform','aud':'terraform','iat':now,'exp':now+3600}
          payload = base64.urlsafe_b64encode(json.dumps(payload_data).encode()).decode().rstrip('=')
          msg = f'{header}.{payload}'.encode()
          sig = base64.urlsafe_b64encode(hmac.new(secret_bytes, msg, hashlib.sha256).digest()).decode().rstrip('=')
          print(f'{header}.{payload}.{sig}')
          EOF
          )

          echo "::add-mask::$TOKEN"
          echo "AEMBIT_OIDC_ID_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Run Acceptance Tests using OIDC Client
        id: test_oidc_client
        if: env.AEMBIT_OIDC_ID_TOKEN != ''
        env:
          TF_ACC: "1"
          TF_LOG: ${{ runner.debug == '1' && 'DEBUG' || '' }}
          AEMBIT_CLIENT_ID: "aembit:devbroadangle:ad6127:identity:oidc_id_token:de9d7d25-ae96-422f-8841-97bc46c6529b"
          AEMBIT_OIDC_ID_TOKEN: ${{ env.AEMBIT_OIDC_ID_TOKEN }}
        run: |          
          go test -v -run "^TestAccCredentialProviderResource_ApiKey$" ./internal/provider/...
          exit ${PIPESTATUS[0]}
        timeout-minutes: 5
        
      - name: Run Acceptance Tests
        id: test
        env:
          TF_ACC: "1"
          TF_LOG: ${{ runner.debug == '1' && 'DEBUG' || '' }}
        run: |
          CPU_COUNT=$(nproc)
          echo "Detected $CPU_COUNT CPU cores for parallelization"

          go test -timeout 20m -parallel "$CPU_COUNT" -json -v -coverprofile coverage.out ./internal/provider/... | tee results.json | jq 'select(.Output != null) | .Output' | sed s/\"//g          
          exit ${PIPESTATUS[0]}
        timeout-minutes: 20

      # Upload coverage output as artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.terraform }}
          path: |
            coverage.out
            results.json
          retention-days: 1

  # Run SonarCloud Scanner and upload results
  sonarcloud:
    name: SonarCloud Scan
    needs: test
    if: always() && !inputs.regression
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SUBMODULE_CHECKOUT_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_CHECKOUT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Aembit/terraform-provider-aembit
          token: ${{ steps.generate-token.outputs.token }}
          submodules: recursive
          fetch-depth: 0

      - name: Download Test Coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}